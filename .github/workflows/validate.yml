name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        # Pinned to the stable channel so a new release cannot break CI unannounced.
        run: npm install -g @anthropic-ai/claude-code@stable

      - name: Validate plugin and marketplace manifests
        run: claude plugin validate .

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Check agent and skill frontmatter
        run: python3 .github/scripts/check_frontmatter.py
