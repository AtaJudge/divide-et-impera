<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#3a6df0"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4256"/>
      <stop offset="1" stop-color="#1f2433"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e8f0"/>
    </linearGradient>
    <linearGradient id="tie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#d93a32"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset="1" stop-color="#d9d0bd"/>
    </linearGradient>
    <linearGradient id="caseSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc5b0"/>
      <stop offset="1" stop-color="#b9ae96"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#2c4a3e"/>
      <stop offset="1" stop-color="#0d1a16"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1e5c" flood-opacity="0.35"/>
    </filter>
    <filter id="phosphor" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="0" y="0" width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#bgGlow)"/>

    <!-- body: suit jacket -->
    <g filter="url(#soft)">
      <path d="M190 1024 C 200 830, 300 735, 420 715 L 604 715 C 724 735, 824 830, 834 1024 Z" fill="url(#suit)"/>
      <!-- shirt V -->
      <path d="M430 715 L 594 715 L 512 905 Z" fill="url(#shirt)"/>
      <!-- lapels (under the tie) -->
      <path d="M420 715 L 452 715 L 512 905 L 470 830 Z" fill="#2a3042"/>
      <path d="M604 715 L 572 715 L 512 905 L 554 830 Z" fill="#2a3042"/>
      <!-- tie: one continuous blade, then knot on top -->
      <path d="M497 790 L 527 790 L 552 950 L 512 992 L 472 950 Z" fill="url(#tie)"/>
      <path d="M497 790 L 527 790 L 520 812 L 504 812 Z" fill="#b8302a" opacity="0.5"/>
      <path d="M488 752 L 536 752 L 528 794 L 496 794 Z" fill="url(#tie)"/>
      <!-- collar points over the knot -->
      <path d="M430 712 L 500 752 L 476 800 Z" fill="#ffffff"/>
      <path d="M594 712 L 524 752 L 548 800 Z" fill="#ffffff"/>
    </g>

    <!-- neck / monitor stand -->
    <rect x="462" y="640" width="100" height="80" rx="18" fill="url(#caseSide)"/>

    <!-- CRT head -->
    <g filter="url(#soft)">
      <!-- rear bulge -->
      <rect x="300" y="210" width="424" height="400" rx="80" fill="url(#caseSide)" transform="translate(28 18)"/>
      <!-- front bezel -->
      <rect x="272" y="196" width="480" height="440" rx="92" fill="url(#case)"/>
      <!-- screen -->
      <rect x="326" y="246" width="372" height="292" rx="64" fill="url(#screen)"/>
      <!-- terminal in phosphor green -->
      <g fill="#7dffb0" opacity="0.38">
        <rect x="370" y="292" width="150" height="20" rx="10"/>
        <rect x="536" y="292" width="96" height="20" rx="10"/>
        <rect x="370" y="334" width="230" height="20" rx="10"/>
        <rect x="370" y="376" width="120" height="20" rx="10"/>
        <rect x="506" y="376" width="150" height="20" rx="10"/>
      </g>
      <g filter="url(#phosphor)">
        <text x="366" y="490" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="92" font-weight="bold" fill="#7dffb0">$</text>
        <rect x="438" y="468" width="62" height="20" rx="6" fill="#7dffb0"/>
      </g>
      <!-- glare -->
      <path d="M346 262 L 678 262 Q 690 262 688 274 L 682 330 Q 520 300 340 360 L 338 286 Q 338 262 346 262 Z" fill="url(#glare)"/>
      <!-- chin details -->
      <rect x="350" y="566" width="120" height="16" rx="8" fill="#c8bea8"/>
      <circle cx="660" cy="574" r="14" fill="#c8bea8"/>
      <circle cx="660" cy="574" r="6" fill="#59d38b"/>
    </g>
  </g>
</svg>
