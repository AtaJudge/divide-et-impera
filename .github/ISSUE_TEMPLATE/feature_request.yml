name: Feature request
description: Suggest an improvement to how work is split, verified or reported.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: example
    attributes:
      label: An example task where this would help
